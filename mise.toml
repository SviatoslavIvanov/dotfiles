[tasks.fmt]
run = "nix fmt"
description = "Format Nix files"

[tasks.check]
run = "statix check ."
description = "Lint Nix files"

[tasks.fmt-check]
run = "rg --files -g '*.nix' -0 | xargs -0 nix run .#nixfmt -- --check"
description = "Check Nix formatting without editing files"

[tasks.fix]
run = "statix fix ."
description = "Auto-fix lint issues"
confirm = "Apply automatic Statix fixes?"

[tasks.dead]
run = "deadnix --fail ."
description = "Find dead code"

[tasks.clean]
run = "deadnix --edit ."
description = "Remove dead code"
confirm = "Remove code that Deadnix considers unused?"

[tasks.flake-check]
run = "nix flake check"
description = "Check flake validity"

[tasks.lint]
depends = ["fmt-check", "check", "dead", "flake-check"]
description = "Run all checks"
