[tasks.fmt]
run = "nix fmt"
description = "Format Nix files"

[tasks.check]
run = "statix check ."
description = "Lint Nix files"

[tasks.fmt-check]
run = "rg --files -g '*.nix' -0 | xargs -0 nix run --no-update-lock-file .#nixfmt -- --check"
description = "Check Nix formatting without editing files"

[tasks.fix]
run = "statix fix ."
description = "Auto-fix lint issues"
confirm = "Apply automatic Statix fixes?"

[tasks.dead]
run = "deadnix --fail ."
description = "Find dead code"

[tasks.clean]
run = "deadnix --edit ."
description = "Remove dead code"
confirm = "Remove code that Deadnix considers unused?"

[tasks.flake-check]
run = "nix flake check --no-update-lock-file"
description = "Check flake validity"

[tasks.lua-check]
run = "stylua --check configs/nvim-lazyvim configs/nvim-vscode"
description = "Check Lua formatting"

[tasks.lock-check]
run = "mise --cd configs/mise lock --dry-run --json | jq -e 'length == 0' && jq -e 'type == \"object\"' configs/nvim-lazyvim/lazy-lock.json >/dev/null"
description = "Check mise and Neovim lock files"

[tasks.pi-check]
run = "node configs/pi/tests/settings.mjs"
description = "Check Pi settings preservation, launcher migration and version consistency"

[tasks.pi-extensions-check]
run = ["node configs/pi/tests/extensions.mjs", "node configs/pi/tests/background.mjs", "node configs/pi/tests/ui.mjs", "node configs/pi/tests/screens.mjs"]
description = "Check installed Pi extension compatibility and critical regressions (no API calls)"

[tasks.secret-check]
run = "gitleaks dir --redact --no-banner . && gitleaks git --redact --no-banner ."
description = "Scan the working tree and Git history for secrets"

[tasks.lint]
depends = ["fmt-check", "check", "dead", "flake-check", "lua-check", "lock-check", "pi-check", "secret-check"]
description = "Run all checks"
